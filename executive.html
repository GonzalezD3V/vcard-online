<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Card - QR Create</title>
    <style>
        :root { --accent: #A2231D; --bg: #727980; }
        body { background: var(--bg); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        /* Glass Card */
        .glass-card { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.2); border-radius: 30px; width: 350px; padding: 50px 20px; text-align: center; color: white; box-shadow: 0 25px 45px rgba(0,0,0,0.2); }
        .profile-img { width: 130px; height: 130px; border-radius: 50%; border: 4px solid white; object-fit: cover; margin-bottom: 20px; }
        .name { font-size: 1.8em; font-weight: 300; margin: 10px 0; }
        .line { width: 50px; height: 3px; background: var(--accent); margin: 20px auto; }
        .btn-exec { display: inline-block; width: 80%; padding: 12px; margin: 10px 0; border-radius: 50px; background: white; color: #333; text-decoration: none; font-weight: 600; transition: 0.3s; }
        .btn-exec:hover { background: var(--accent); color: white; }
    </style>
</head>
<body>
    <div class="glass-card">
        <img id="photo" src="" class="profile-img">
        <div class="name" id="name"></div>
        <div id="title" style="opacity: 0.8;"></div>
        <div class="line"></div>
        <div id="links"></div>
    </div>
    <script>
        fetch('data.json').then(r => r.json()).then(data => {
            document.getElementById('name').innerText = data.fn;
            document.getElementById('title').innerText = data.title;
            document.getElementById('photo').src = data.photo;
            const links = document.getElementById('links');
            const actions = [
                {label: 'Contacto', url: 'tel:' + data.cell},
                {label: 'Portafolio', url: data.url_web}
            ];
            actions.forEach(a => {
                if(a.url) links.innerHTML += `<a href="${a.url}" class="btn-exec">${a.label}</a>`;
            });
        });
    </script>
</body>
</html>
